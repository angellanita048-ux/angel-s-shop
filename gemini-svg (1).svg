<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Lingkaran Utama Navy Blue -->
  <circle cx="250" cy="250" r="240" fill="#14213D"/>

  <!-- Bingkai Lingkaran Dalam (Garis Putih Tipis) -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8,4" opacity="0.8"/>
  <circle cx="250" cy="250" r="214" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

  <!-- Ikon Sayap Soft di Tengah Lingkaran -->
  <g transform="translate(250, 185)" fill="#FFFFFF">
    <!-- Sayap Kiri -->
    <path d="M -10,-25 C -30,-15 -50,5 -58,30 C -42,22 -28,10 -12,-8 Z" opacity="0.95"/>
    <path d="M -12,-10 C -30,0 -48,20 -52,42 C -38,30 -26,18 -10,2 Z" opacity="0.75"/>
    
    <!-- Sayap Kanan -->
    <path d="M 10,-25 C 30,-15 50,5 58,30 C 42,22 28,10 12,-8 Z" opacity="0.95"/>
    <path d="M 12,-10 C 30,0 48,20 52,42 C 38,30 26,18 10,2 Z" opacity="0.75"/>

    <!-- Halo / Mahkota Kecil -->
    <ellipse cx="0" cy="-35" rx="18" ry="5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Tulisan Utama "ANGEL" -->
  <text x="250" y="295" font-family="'Playfair Display', 'Georgia', serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ANGEL</text>

  <!-- Tulisan "COLLECTION" -->
  <text x="250" y="332" font-family="'Montserrat', 'Arial', sans-serif" font-size="14" font-weight="300" fill="#FFFFFF" text-anchor="middle" letter-spacing="8" opacity="0.9">COLLECTION</text>

  <!-- Sub-teks "EST. 2026 • GAMIS & MODEST WEAR" -->
  <text x="250" y="365" font-family="'Montserrat', 'Arial', sans-serif" font-size="10" font-weight="400" fill="#E2E8F0" text-anchor="middle" letter-spacing="3" opacity="0.75">GAMIS &amp; MODEST WEAR</text>

  <!-- Aksen Bintang Dekoratif Kiri & Kanan -->
  <path d="M 140,290 L 142,284 L 148,284 L 143,280 L 145,274 L 140,278 L 135,274 L 137,280 L 132,284 L 138,284 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M 360,290 L 362,284 L 368,284 L 363,280 L 365,274 L 360,278 L 355,274 L 357,280 L 352,284 L 358,284 Z" fill="#FFFFFF" opacity="0.8"/>
</svg>
